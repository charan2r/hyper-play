name: Docker Hub build and push

on:
    push:
        branches:
            - main

jobs:
    docker:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # login to docker hub
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{secrets.DOCKERHUB_USERNAME}}
                  password: ${{secrets.DOCKERHUB_TOKEN}}

            # build backend
            - name: Build & Push Backend
              uses: docker/build-push-action@v5
              with:
                  context: ./backend
                  push: true
                  tags: |
                      ${{secrets.DOCKERHUB_USERNAME}}/hyper-play-backend:latest

            # build user frontend
            - name: Build & Push User Frontend
              uses: docker/build-push-action@v5
              with:
                  context: ./frontend
                  push: true
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/hyper-play-frontend-user:latest

            # build admin frontend
            - name: Build & Push Admin Frontend
              uses: docker/build-push-action@v5
              with:
                  context: ./admin
                  push: true
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/hyper-play-frontend-admin:latest
