services:
  - type: web
    name: hyper-play-backend
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hyper-play-db
          property: connectionString
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        sync: false
      - key: AWS_ACCESS_KEY
        sync: false
      - key: AWS_SECRET_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_BUCKET_NAME
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://hyper-play.vercel.app
      - key: ADMIN_URL
        value: https://admin-hyper-play.vercel.app

databases:
  - name: hyper-play-db
    databaseName: sports
    user: postgres
    region: oregon
